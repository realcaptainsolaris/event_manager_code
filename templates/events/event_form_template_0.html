{% extends 'base.html' %}

{% block title %}
  Event eintragen
{%endblock%}

{% block head %}
<h1 class="display-6 fw-bold lh-1">Event eintragen</h1>
{%endblock%}

{% block content %}

<div class="container mt-4">

    <div class="mb-3">
        <a href="{% url 'events:event-list' %}" class="btn btn-secondary">
            Zurück zur Übersicht
        </a>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            {{ form }}
        </div>

        <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-primary">
                Jetzt eintragen
            </button>
        </div>
    </form>

</div>

{% endblock %}
