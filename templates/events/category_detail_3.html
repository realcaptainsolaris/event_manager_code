{% extends 'base.html' %}

{% block title %}
{{category.name}}
{% endblock %}

{% block head %}
<p>
    <a href="{% url 'events:category-list' %}">zurück zur Übersicht aller Kategorien</a><br>
</p>
<h1 class="display-6 fw-bold lh-1">{{category.name}}</h1>
<h3 class="display-6 lh-3">{{category.sub_title}}</h3>

<span style="font-size:12px;">
<a href="{% url 'events:category-update' category.pk %}">editieren</a>
</span>

{% endblock %}

{% block content %}

<div class="container">
<div class="col-lg-8 col-sm-12">
    <p>{{category.description}}</p>
</div>
</div>
{% endblock %}
